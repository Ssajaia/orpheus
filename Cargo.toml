[package]
name = "orpheus"
version = "0.1.0"
edition = "2024"
description = "A minimal, lightweight desktop music player"
license = "MIT"

[dependencies]
directories = "6"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rodio = { version = "0.23", default-features = false, features = [
    "playback",
    "flac",
    "mp3",
    "vorbis",
    "wav",
] }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
